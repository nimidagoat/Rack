<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>ClosetKind — Your wardrobe, finally useful.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f5f1;--card:#fff;--ink:#181817;--muted:#77756f;--line:#e7e4dc;--accent:#2f4a3a;--accent2:#d9a441;--soft:#eceee8;--danger:#9c4444;--shadow:0 14px 40px rgba(31,35,30,.07)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 18px;background:rgba(246,245,241,.9);backdrop-filter:blur(16px);display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 28px}.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(47,74,58,.24)}.brand b{font-family:'Playfair Display',serif;font-size:21px}
    .nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;border-radius:13px;padding:12px 13px;text-align:left;display:flex;align-items:center;gap:12px;color:#68665f;font-weight:600}.nav button.active,.nav button:hover{background:#e9ede6;color:var(--accent)}.nav .plus{margin-top:10px;background:var(--accent);color:white}.nav .plus:hover{background:#294334;color:#fff}.icon{width:20px;text-align:center;font-size:17px}
    .side-note{margin-top:auto;background:#eeebe2;border-radius:17px;padding:16px;font-size:12px;color:#6f6b63;line-height:1.5}.side-note b{display:block;color:var(--ink);margin-bottom:4px}
    .main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5;background:rgba(246,245,241,.87);backdrop-filter:blur(16px)}.crumb{font-size:13px;color:var(--muted)}.profile{width:38px;height:38px;border-radius:50%;background:#d4bea1;display:grid;place-items:center;font-weight:700}
    .page{padding:34px 34px 56px;max-width:1380px;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.hero h1{font-family:'Playfair Display',serif;font-size:40px;line-height:1.05;margin:7px 0 8px;letter-spacing:-.02em}.hero p{margin:0;color:var(--muted);max-width:640px}.primary{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px 17px;font-weight:700;display:inline-flex;gap:9px;align-items:center;box-shadow:0 7px 19px rgba(47,74,58,.18)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:600}.secondary:hover{border-color:#c9c4b8}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px 17px;box-shadow:0 6px 22px rgba(31,35,30,.03)}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:3px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}.section-head h2{font-size:18px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#5f5c55;font-size:12px;font-weight:600}.chip.active,.chip:hover{background:#e8ede7;color:var(--accent);border-color:#d2dbd0}
    .outfit-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.outfit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.score{background:#edf2ea;color:var(--accent);padding:7px 10px;border-radius:999px;font-weight:800;font-size:12px}.outfit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item-tile{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fbfaf7;position:relative}.item-img{aspect-ratio:4/5;background:#eee9df;display:grid;place-items:center;overflow:hidden}.item-img img{width:100%;height:100%;object-fit:cover}.swatch{width:74px;height:74px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.item-meta{padding:10px}.item-meta b{font-size:12px;display:block}.item-meta small{font-size:11px;color:var(--muted)}.why{padding:12px 1px 0;color:#67645d;font-size:12px;line-height:1.5}.why b{color:var(--ink)}
    .wardrobe-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.wardrobe-grid .item-tile{cursor:pointer}.wardrobe-grid .item-tile:hover{transform:translateY(-2px);transition:.18s}
    .searchbox{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 14px;display:flex;gap:10px;align-items:center}.searchbox input{border:0;outline:0;flex:1;font-size:15px;background:transparent}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px;margin-top:13px}.filters select{border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:12px;color:#4f4b44}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.suggestion-card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px}.suggestion-card .row{display:flex;gap:8px;align-items:center;margin-top:12px}.mini-swatch{width:42px;height:42px;border-radius:11px;border:1px solid rgba(0,0,0,.08)}
    .library-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.lib-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px}.lib-collage{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.lib-collage .item-img{border-radius:11px}.lib-card h3{margin:12px 0 4px;font-size:14px}.lib-card small{color:var(--muted)}
    .new-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.new-card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px}.new-card h3{font-size:15px;margin:0 0 6px}.new-card p{color:var(--muted);font-size:12px;line-height:1.5}.tag{display:inline-block;padding:6px 8px;background:#f0efe9;border-radius:999px;font-size:10px;font-weight:700;margin-top:9px}
    .modal{position:fixed;inset:0;background:rgba(20,20,17,.38);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-head h2{margin:0;font-family:'Playfair Display',serif}.close{border:0;background:#f1f0ea;width:34px;height:34px;border-radius:50%}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}.form label{font-size:11px;color:var(--muted);font-weight:700}.form input,.form select,.form textarea{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;outline:0}.upload{border:1.5px dashed #c9c5bb;border-radius:17px;padding:18px;text-align:center;background:#fbfaf7}.preview-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview-row img{width:72px;height:90px;border-radius:10px;object-fit:cover}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.mobile-tabs{display:none}
    @media(max-width:1080px){.app{grid-template-columns:84px 1fr}.sidebar{padding:20px 11px}.brand b,.nav span:not(.icon),.side-note{display:none}.brand{justify-content:center}.nav button{justify-content:center}.page{padding:28px 22px}.wardrobe-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:720px){.app{display:block}.sidebar{display:none}.topbar{height:64px;padding:0 15px}.page{padding:23px 15px 90px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:34px}.stats{grid-template-columns:repeat(2,1fr)}.outfit-grid{grid-template-columns:repeat(2,1fr)}.wardrobe-grid{grid-template-columns:repeat(2,1fr)}.suggestions,.library-grid,.new-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.mobile-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 13px 35px rgba(0,0,0,.13);border-radius:19px;padding:7px;z-index:15;backdrop-filter:blur(12px)}.mobile-tabs button{border:0;background:transparent;border-radius:13px;padding:7px 2px;color:#777;font-size:10px}.mobile-tabs button.active{background:#e9ede7;color:var(--accent);font-weight:700}.mobile-tabs .icon{display:block;margin:auto auto 3px}.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const DEFAULT_ITEMS = [
 {id:'1',name:'Olive Overshirt',cat:'shirts',color:'olive',hex:'#68735a',pattern:'solid',fit:'relaxed',formality:2,image:null},
 {id:'2',name:'Cream Oxford',cat:'shirts',color:'cream',hex:'#eee7d7',pattern:'solid',fit:'regular',formality:3,image:null},
 {id:'3',name:'Navy Textured Shirt',cat:'shirts',color:'navy',hex:'#273c57',pattern:'texture',fit:'regular',formality:3,image:null},
 {id:'4',name:'White Graphic Tee',cat:'shirts',color:'white',hex:'#f7f7f3',pattern:'graphic',fit:'relaxed',formality:1,image:null},
 {id:'5',name:'Black Relaxed Trousers',cat:'pants',color:'black',hex:'#292b29',pattern:'solid',fit:'relaxed',formality:3,image:null},
 {id:'6',name:'Stone Baggy Jeans',cat:'pants',color:'stone',hex:'#a89f91',pattern:'solid',fit:'baggy',formality:1, image:null},
 {id:'7',name:'Dark Blue Straight Jeans',cat:'pants',color:'denim',hex:'#354c66',pattern:'solid',fit:'straight',formality:2,image:null},
 {id:'8',name:'Beige Chinos',cat:'pants',color:'beige',hex:'#c9b38d',pattern:'solid',fit:'straight',formality:3,image:null},
 {id:'9',name:'Brown Leather Watch',cat:'accessories',color:'brown',hex:'#7e5b45',pattern:'solid',fit:'classic',formality:3,image:null},
 {id:'10',name:'Silver Chain',cat:'accessories',color:'silver',hex:'#b8bbb9',pattern:'solid',fit:'classic',formality:2,image:null}
];
const state = {tab:localStorage.getItem('ck_tab')||'wardrobe', q:'', cat:'all', color:'all', occasion:'everyday', items:JSON.parse(localStorage.getItem('ck_items')||'null')||DEFAULT_ITEMS, library:JSON.parse(localStorage.getItem('ck_library')||'null')||[]};
const occasions={everyday:'Everyday',college:'College',movie:'Movie hangout',wedding:'Wedding',date:'Dinner / date',party:'Party'};
const palette={black:['white','cream','beige','olive','denim','grey','brown','silver'],white:['navy','black','olive','denim','beige','stone','brown'],cream:['navy','brown','olive','black','denim','beige','stone'],navy:['cream','white','beige','brown','stone','olive','grey','denim'],olive:['cream','white','black','beige','brown','navy','stone'],beige:['navy','white','cream','brown','olive','black','denim'],stone:['navy','white','black','olive','cream','brown'],denim:['white','cream','black','brown','olive','beige','stone'],grey:['white','black','navy','olive','cream'],brown:['cream','white','beige','olive','navy','denim','brown'],silver:['black','white','navy','olive']};
function save(){localStorage.setItem('ck_items',JSON.stringify(state.items));localStorage.setItem('ck_library',JSON.stringify(state.library));localStorage.setItem('ck_tab',state.tab)}
function item(id){return state.items.find(x=>x.id===id)}
function imgOrSwatch(x){return x.image?`<img src="${x.image}" alt="${x.name}">`:`<div class="swatch" style="background:${x.hex}"></div>`}
function itemTile(x){return `<div class="item-tile" onclick="openItem('${x.id}')"><div class="item-img">${imgOrSwatch(x)}</div><div class="item-meta"><b>${x.name}</b><small>${x.cat} · ${x.color}</small></div></div>`}
function nav(){const tabs=[['wardrobe','▦','Wardrobe'],['search','⌕','Search'],['add','＋','Add'],['library','▤','Library'],['suggestions','✦','New finds']];return `<div class="sidebar"><div class="brand"><div class="logo">C</div><b>ClosetKind</b></div><div class="nav">${tabs.map(t=>t[0]==='add'?`<button class="plus" onclick="openAdd()"><span class="icon">${t[1]}</span><span>${t[2]}</span></button>`:`<button class="${state.tab===t[0]?'active':''}" onclick="setTab('${t[0]}')"><span class="icon">${t[1]}</span><span>${t[2]}</span></button>`).join('')}</div><div class="side-note"><b>Style > more stuff.</b> Recommendations prioritize pieces you already own, then flag the smartest gaps to fill.</div></div><div class="mobile-tabs">${tabs.map(t=>`<button class="${state.tab===t[0]?'active':''}" onclick="${t[0]==='add'?'openAdd()':`setTab('${t[0]}')`}"><span class="icon">${t[1]}</span>${t[2]}</button>`).join('')}</div>`}
function topbar(){return `<div class="topbar"><div class="crumb">${state.tab==='wardrobe'?'My wardrobe':state.tab==='search'?'Search':state.tab==='library'?'Library':'New cloth suggestions'}</div><div class="profile">S</div></div>`}
function stats(){let s={shirts:0,pants:0,accessories:0};state.items.forEach(x=>{if(x.cat==='shirts')s.shirts++;if(x.cat==='pants')s.pants++;if(x.cat==='accessories')s.accessories++});return `<div class="stats"><div class="stat"><small>Total pieces</small><b>${state.items.length}</b></div><div class="stat"><small>Shirts</small><b>${s.shirts}</b></div><div class="stat"><small>Pants</small><b>${s.pants}</b></div><div class="stat"><small>Accessories</small><b>${s.accessories}</b></div></div>`}
function compatible(a,b){const direct=palette[a.color]?.includes(b.color);const neutral=['black','white','cream','beige','grey','stone'];if(direct)return 1;if(a.color===b.color)return 0.35;if(neutral.includes(a.color)||neutral.includes(b.color))return .75;return .2}
function outfitScore(top,bottom,acc,occasion){let s=50; s+=compatible(top,bottom)*26; if(top.pattern!=='solid'&&bottom.pattern!=='solid')s-=14; if(top.fit==='relaxed'&&bottom.fit==='baggy')s-=5; if(top.fit==='regular'&&bottom.fit==='straight')s+=3; if(occasion==='wedding')s+=(top.formality+bottom.formality)*4-3; if(occasion==='college')s+=top.formality<=3&&bottom.formality<=3?7:0; if(occasion==='movie')s+=top.formality<=2&&bottom.formality<=2?8:0; if(acc)s+=compatible(bottom,acc)*9; return Math.max(0,Math.min(98,Math.round(s)))}
function bestOutfits(occasion=state.occasion){const tops=state.items.filter(x=>x.cat==='shirts'), bottoms=state.items.filter(x=>x.cat==='pants'), accs=state.items.filter(x=>x.cat==='accessories');let arr=[];for(const t of tops)for(const p of bottoms){const a=accs.find(x=>compatible(p,x)>.6);arr.push({t,p,a,score:outfitScore(t,p,a,occasion)})}return arr.sort((a,b)=>b.score-a.score).slice(0,3)}
function outfitCard(o,saveable=true){return `<div class="outfit-card"><div class="outfit-top"><div><div class="eyebrow">${occasions[state.occasion]}</div><h3 style="margin:5px 0 0;font-size:18px">${o.t.name} + ${o.p.name}</h3></div><div class="score">${o.score}% match</div></div><div class="outfit-grid">${itemTile(o.t)}${itemTile(o.p)}${o.a?itemTile(o.a):''}</div><div class="why"><b>Why it works:</b> ${compatibility(o.t,o.p)>.8?'strong color balance':'balanced contrast'}, ${o.t.pattern==='solid'||o.p.pattern==='solid'?'one visual anchor':'controlled texture'}, and ${o.a?'an accessory that echoes the palette.':'room to finish with your own accessories.'} ${saveable?`<button class="secondary" style="margin-left:8px" onclick='saveOutfit(${JSON.stringify([o.t.id,o.p.id,o.a?.id||null])})'>Save to library</button>`:''}</div></div>`}
function wardrobe(){const best=bestOutfits();return `<div class="hero"><div><div class="eyebrow">Your digital closet</div><h1>Dress better with what you already own.</h1><p>No closet archaeology required. Pick an occasion and ClosetKind ranks combinations using color compatibility, pattern balance, formality and silhouette.</p></div><button class="primary" onclick="openAdd()">＋ Add new piece</button></div>${stats()}<div class="section-head"><h2>Best look right now</h2><span>Ranked from your wardrobe</span></div><div class="chips">${Object.entries(occasions).map(([k,v])=>`<button class="chip ${state.occasion===k?'active':''}" onclick="setOccasion('${k}')">${v}</button>`).join('')}</div><div style="display:grid;gap:13px;margin-top:13px">${best.map(outfitCard).join('')}</div><div class="section-head"><h2>Your pieces</h2><span>${state.items.length} items</span></div><div class="wardrobe-grid">${state.items.map(itemTile).join('')}</div>`}
function searchPage(){let filtered=state.items.filter(x=>(state.q===''||`${x.name} ${x.color} ${x.pattern}`.toLowerCase().includes(state.q.toLowerCase()))&&(state.cat==='all'||x.cat===state.cat)&&(state.color==='all'||x.color===state.color));const ops=['wedding','college','movie','party'];return `<div class="hero"><div><div class="eyebrow">Search your closet</div><h1>Find the right thing, fast.</h1><p>Search by color, pattern or use-case. Humanity has invented indexes because staring at piles of cotton clearly wasn't scalable.</p></div></div><div class="searchbox">⌕<input value="${state.q}" oninput="state.q=this.value;render()" placeholder="Try “navy”, “textured”, “college”..." /></div><div class="filters"><select onchange="state.cat=this.value;render()"><option value="all">All categories</option><option value="shirts">Shirts</option><option value="pants">Pants</option><option value="accessories">Accessories</option></select><select onchange="state.color=this.value;render()"><option value="all">All colours</option>${['black','white','cream','navy','olive','beige','stone','denim','grey','brown','silver'].map(c=>`<option ${state.color===c?'selected':''} value="${c}">${c}</option>`).join('')}</select><select onchange="state.occasion=this.value;render()">${Object.entries(occasions).map(([k,v])=>`<option ${state.occasion===k?'selected':''} value="${k}">${v}</option>`).join('')}</select><button class="secondary" onclick="state.q='';state.cat='all';state.color='all';render()">Reset</button></div><div class="section-head"><h2>Occasion shortcuts</h2></div><div class="suggestions">${ops.map(k=>{let o=bestOutfits(k)[0];return `<div class="suggestion-card"><div class="eyebrow">Perfect for ${occasions[k].toLowerCase()}</div><div class="row"><div class="mini-swatch" style="background:${o.t.hex}"></div><div><b>${o.t.name}</b><br><small>${o.p.name} · ${o.score}% match</small></div></div></div>`}).join('')}</div><div class="section-head"><h2>Results</h2><span>${filtered.length} items</span></div><div class="wardrobe-grid">${filtered.map(itemTile).join('')||'<div style="color:var(--muted)">No pieces match that search.</div>'}</div>`}
function libraryPage(){return `<div class="hero"><div><div class="eyebrow">Saved combinations</div><h1>Your outfit library.</h1><p>Keep the combinations that survived your internal fashion review board.</p></div><button class="primary" onclick="setTab('wardrobe')">Find another look</button></div>${state.library.length?`<div class="library-grid">${state.library.map((ids,i)=>{const xs=ids.map(item).filter(Boolean);return `<div class="lib-card"><div class="lib-collage">${xs.map(x=>`<div class="item-img">${imgOrSwatch(x)}</div>`).join('')}</div><h3>Look ${i+1}</h3><small>${xs.map(x=>x.name).join(' · ')}</small><div style="margin-top:10px"><button class="secondary" onclick="deleteOutfit(${i})">Remove</button></div></div>`}).join('')}</div>`:'<div class="outfit-card"><b>Your library is empty.</b><div style="margin-top:5px;color:var(--muted);font-size:13px">Save a recommendation from My Wardrobe and it lands here.</div></div>'}`}
function suggestionsPage(){const owned=new Set(state.items.map(x=>x.color));const gaps=[];const combos=[['cream','navy'],['olive','cream'],['brown','cream'],['black','beige'],['navy','stone'],['white','denim'],['forest','stone']];for(const [a,b] of combos){if(!owned.has(a)||!owned.has(b))gaps.push([a,b])}return `<div class="hero"><div><div class="eyebrow">Buy smarter</div><h1>New pieces worth adding.</h1><p>These are wardrobe gaps, not shopping for sport. The best additions either unlock several combinations or introduce a missing anchor color.</p></div></div><div class="new-grid">${gaps.slice(0,6).map(([a,b])=>`<div class="new-card"><div style="display:flex;gap:8px"><div class="mini-swatch" style="background:${colorHex(a)}"></div><div class="mini-swatch" style="background:${colorHex(b)}"></div></div><h3>${titleColor(a)} shirt + ${titleColor(b)} trousers</h3><p>High-value pairing with your current wardrobe. It adds a new route without creating a one-outfit orphan.</p><span class="tag">SMART GAP</span></div>`).join('')}</div><div class="section-head"><h2>How this works</h2></div><div class="outfit-card"><b>We prefer compatibility over novelty.</b><div class="why">New suggestions are based on missing color anchors and combinations that complement the pieces you already own. A shopping app that only tells you to buy more clothes is basically a casino with nicer typography.</div></div>`}
function colorHex(c){return {black:'#292b29',white:'#f5f5ef',cream:'#eee7d7',navy:'#273c57',olive:'#68735a',beige:'#c9b38d',stone:'#a89f91',denim:'#354c66',grey:'#8f918e',brown:'#7e5b45',silver:'#b8bbb9',forest:'#345441'}[c]||'#ddd'}
function titleColor(s){return s[0].toUpperCase()+s.slice(1)}
function page(){return state.tab==='search'?searchPage():state.tab==='library'?libraryPage():state.tab==='suggestions'?suggestionsPage():wardrobe()}
function render(){document.getElementById('app').innerHTML=`<div class="app">${nav()}<div class="main">${topbar()}<main class="page">${page()}</main></div></div><div id="modal" class="modal"></div>`}
function setTab(t){state.tab=t;save();render()}
function setOccasion(o){state.occasion=o;render()}
function openItem(id){const x=item(id);document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${x.name}</h2><button class="close" onclick="closeModal()">×</button></div><div style="display:grid;grid-template-columns:180px 1fr;gap:18px"><div class="item-img" style="border-radius:18px">${imgOrSwatch(x)}</div><div><div class="eyebrow">${x.cat}</div><p style="margin:6px 0;color:var(--muted)">${titleColor(x.color)} · ${titleColor(x.pattern)} · ${titleColor(x.fit)} fit</p><p style="font-size:13px;line-height:1.6;color:#5f5c55">This piece is currently part of ${bestOutfits().filter(o=>o.t.id===x.id||o.p.id===x.id).length} top-ranked combinations in your closet.</p><button class="secondary" onclick="removeItem('${x.id}')">Delete item</button></div></div></div>`;document.getElementById('modal').classList.add('open')}
function openAdd(){document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Add a new piece</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="full upload"><b>Capture it from multiple angles</b><div style="font-size:12px;color:var(--muted);margin:5px 0 12px">Front, back, detail. Pick up to 4 photos.</div><input id="files" type="file" accept="image/*" multiple onchange="previewFiles(event)" /><div class="preview-row" id="previews"></div></div><div><label>Name<input id="name" placeholder="e.g. Brown knit polo" /></label></div><div><label>Category<select id="cat"><option value="shirts">Shirt / top</option><option value="pants">Pants</option><option value="accessories">Accessory</option></select></label></div><div><label>Colour<select id="color">${['black','white','cream','navy','olive','beige','stone','denim','grey','brown','silver'].map(c=>`<option value="${c}">${c}</option>`).join('')}</select></label></div><div><label>Pattern<select id="pattern"><option>solid</option><option>stripe</option><option>check</option><option>texture</option><option>graphic</option></select></label></div><div><label>Fit<select id="fit"><option>regular</option><option>relaxed</option><option>baggy</option><option>straight</option><option>classic</option></select></label></div></div><div class="modal-foot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addItem()">Save to wardrobe</button></div></div>`;document.getElementById('modal').classList.add('open')}
let stagedImages=[];function previewFiles(e){stagedImages=[];const files=[...e.target.files].slice(0,4);const box=document.getElementById('previews');box.innerHTML='';files.forEach(f=>{const r=new FileReader();r.onload=ev=>{stagedImages.push(ev.target.result);const im=document.createElement('img');im.src=ev.target.result;box.appendChild(im)};r.readAsDataURL(f)})}
function addItem(){const name=document.getElementById('name').value.trim()||'New piece';const cat=document.getElementById('cat').value,color=document.getElementById('color').value,pattern=document.getElementById('pattern').value,fit=document.getElementById('fit').value;state.items.unshift({id:crypto.randomUUID(),name,cat,color,hex:colorHex(color),pattern,fit,formality:cat==='shirts'&&pattern==='graphic'?1:2,image:stagedImages[0]||null,angles:stagedImages});save();stagedImages=[];closeModal();render()}
function saveOutfit(ids){state.library.unshift(ids);save();setTab('library')}
function deleteOutfit(i){state.library.splice(i,1);save();render()}
function removeItem(id){state.items=state.items.filter(x=>x.id!==id);save();closeModal();render()}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body>
</html>
